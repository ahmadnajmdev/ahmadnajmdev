<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img">
  <title>TECH STACK</title>
  <defs>
    <style>@font-face{font-family:'ORB';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
    .pulse{animation:run 4.5s linear infinite}
    @keyframes run{from{transform:translateX(0)}to{transform:translateX(1200px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
    <radialGradient id="gA"><stop offset="0" stop-color="#A66BFF" stop-opacity=".16"/><stop offset="1" stop-color="#A66BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".12"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A66BFF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#1A2742" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity=".6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="76" rx="12"/></clipPath>
    
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity=".07"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#fff" opacity=".035"/>
  </pattern>
    
  <filter id="neon" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.4000000000000004" result="b1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="8.8" result="b2"/>
    <feFlood flood-color="#A66BFF"/>
    <feComposite in2="b1" operator="in" result="g1"/>
    <feFlood flood-color="#A66BFF" flood-opacity=".55"/>
    <feComposite in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
    <linearGradient id="pulse"><stop offset="0" stop-color="#A66BFF" stop-opacity="0"/><stop offset="1" stop-color="#A66BFF"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="76" fill="#05070D"/>
    <rect width="1200" height="76" fill="url(#grid)"/>
    
    
  <rect width="1200" height="76" fill="#0A0F1C" opacity=".6"/>
  <text x="34" y="45" font-family="'JBM', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="20" fill="#FF2BD6">//03</text>
  <text x="112" y="48" font-family="'ORB', 'JBM', ui-sans-serif, sans-serif" font-weight="900" font-size="28" letter-spacing="5" fill="#F4FEFF" filter="url(#neon)">TECH STACK</text>
  <rect x="-140" y="73" width="140" height="3" fill="url(#pulse)" class="pulse"/>
  <path d="M0 74.5H1200" stroke="#A66BFF" stroke-opacity=".25"/>
    <rect width="1200" height="76" fill="url(#scan)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="74.5" rx="11.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
