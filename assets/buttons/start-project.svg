<svg xmlns="http://www.w3.org/2000/svg" width="560" height="96" viewBox="0 0 560 96" role="img">
  <title>Start a project with GO Software</title>
  <defs><style>@font-face{font-family:'ORB';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
    .glow{animation:glow 2.6s ease-in-out infinite}
    @keyframes glow{50%{opacity:.45}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(6px)}}</style>
  <filter id="neon" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.0999999999999996" result="b1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="7.699999999999999" result="b2"/>
    <feFlood flood-color="#00F0FF"/>
    <feComposite in2="b1" operator="in" result="g1"/>
    <feFlood flood-color="#00F0FF" flood-opacity=".55"/>
    <feComposite in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF" stop-opacity=".16"/><stop offset="1" stop-color="#FF2BD6" stop-opacity=".1"/></linearGradient>
  </defs>
  <path class="glow" d="M18 0H552V70L534 88H0V18Z" transform="translate(4 4)" fill="none" stroke="url(#edge)" stroke-width="6" opacity=".9" filter="url(#neon)"/>
  <path d="M18 0H552V70L534 88H0V18Z" transform="translate(4 4)" fill="#05070D"/>
  <path d="M18 0H552V70L534 88H0V18Z" transform="translate(4 4)" fill="url(#fill)" stroke="url(#edge)" stroke-width="2"/>
  <text x="44" y="47" font-family="'ORB', 'JBM', ui-sans-serif, sans-serif" font-weight="900" font-size="24" letter-spacing="3" fill="#F4FEFF" filter="url(#neon)">START A PROJECT</text>
  <text x="44" y="72" font-family="'JBM', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8AF8FF">gosoftware.krd · web + mobile, end to end</text>
  <g transform="translate(482 32) scale(1.35)"><g class="nudge"><path d="M3 12H20M14 6L20 12L14 18" fill="none" stroke="#FF2BD6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
