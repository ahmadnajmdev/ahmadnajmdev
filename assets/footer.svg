<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img">
  <title>End of transmission</title>
  <defs>
    <style>@font-face{font-family:'ORB';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
    .dot{animation:run 3.6s linear infinite}
    @keyframes run{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
    <radialGradient id="gA"><stop offset="0" stop-color="#00F0FF" stop-opacity=".16"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".12"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#1A2742" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity=".6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="112" rx="18"/></clipPath>
    
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity=".07"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#fff" opacity=".035"/>
  </pattern>
    <linearGradient id="trail"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="1" stop-color="#00F0FF"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="112" fill="#05070D"/>
    <rect width="1200" height="112" fill="url(#grid)"/>
    
    
  <path d="M0 90H1200" stroke="#00F0FF" stroke-opacity=".18"/>
  <g class="dot"><rect x="-80" y="88.5" width="80" height="3" fill="url(#trail)"/><circle cy="90" r="3.5" fill="#00F0FF"/></g>
  <text x="600" y="42" text-anchor="middle" font-family="'ORB', 'JBM', ui-sans-serif, sans-serif" font-weight="600" font-size="15" letter-spacing="6" fill="#00F0FF">// END OF TRANSMISSION</text>
  <text x="600" y="70" text-anchor="middle" font-family="'JBM', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8A9BB5">thanks for stopping by — let's build something great</text>
    <rect width="1200" height="112" fill="url(#scan)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="110.5" rx="17.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
